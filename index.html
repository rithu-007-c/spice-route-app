<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpiceRoute – Restaurant Management</title>
  <meta name="description" content="SpiceRoute Restaurant Command Center – manage orders, tables, staff, and more." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- AUTH / ROLE SELECT -->
    <section id="auth-view" class="view active">
      <div class="auth-container">
        <div class="brand">
          <div class="logo">🍽️</div>
          <h1>SpiceRoute</h1>
          <p class="tagline">Restaurant Command Center</p>
        </div>

        <!-- ROLE GRID -->
        <div class="role-grid" id="role-grid">
          <button class="role-card" data-role="customer">
            <span class="role-icon">👤</span>
            <span class="role-name">Customer</span>
            <span class="role-desc">Order food &amp; book tables</span>
          </button>
          <button class="role-card" data-role="server">
            <span class="role-icon">🛎️</span>
            <span class="role-name">Server</span>
            <span class="role-desc">Waiter – manage tables &amp; orders</span>
          </button>
          <button class="role-card" data-role="chef">
            <span class="role-icon">👨‍🍳</span>
            <span class="role-name">Chef</span>
            <span class="role-desc">Kitchen – prepare orders</span>
          </button>
          <button class="role-card" data-role="manager">
            <span class="role-icon">📋</span>
            <span class="role-name">Manager</span>
            <span class="role-desc">Floor &amp; staff oversight</span>
          </button>
          <button class="role-card" data-role="management">
            <span class="role-icon">🏢</span>
            <span class="role-name">Management</span>
            <span class="role-desc">Full control &amp; reports</span>
          </button>
        </div>

        <!-- QR SCAN SCREEN (staff only) -->
        <div id="qr-scan-wrap" class="qr-scan-wrap hidden">
          <button class="back-btn" id="back-from-qr">← Change role</button>
          <div class="qr-card">
            <div class="qr-card-header">
              <span class="qr-badge" id="qr-role-badge">🛎️ Server</span>
              <h2 class="qr-title">Scan to Access</h2>
              <p class="qr-sub">Point your device at the restaurant QR code to proceed to login</p>
            </div>
            <div class="qr-code-box" id="qr-code-box">
              <!-- QR Code rendered as SVG grid -->
              <svg class="qr-svg" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
                <!-- Top-left finder -->
                <rect x="0" y="0" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/>
                <rect x="1" y="1" width="5" height="5" fill="none" stroke="currentColor" stroke-width="0.5"/>
                <rect x="2" y="2" width="3" height="3" fill="currentColor"/>
                <!-- Top-right finder -->
                <rect x="14" y="0" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/>
                <rect x="15" y="1" width="5" height="5" fill="none" stroke="currentColor" stroke-width="0.5"/>
                <rect x="16" y="2" width="3" height="3" fill="currentColor"/>
                <!-- Bottom-left finder -->
                <rect x="0" y="14" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/>
                <rect x="1" y="15" width="5" height="5" fill="none" stroke="currentColor" stroke-width="0.5"/>
                <rect x="2" y="16" width="3" height="3" fill="currentColor"/>
                <!-- Data modules -->
                <rect x="8" y="0" width="1" height="1" fill="currentColor"/>
                <rect x="10" y="0" width="1" height="1" fill="currentColor"/>
                <rect x="12" y="0" width="1" height="1" fill="currentColor"/>
                <rect x="9" y="2" width="1" height="1" fill="currentColor"/>
                <rect x="11" y="2" width="2" height="1" fill="currentColor"/>
                <rect x="8" y="4" width="2" height="1" fill="currentColor"/>
                <rect x="12" y="4" width="1" height="1" fill="currentColor"/>
                <rect x="8" y="6" width="1" height="1" fill="currentColor"/>
                <rect x="10" y="6" width="3" height="1" fill="currentColor"/>
                <rect x="0" y="8" width="1" height="1" fill="currentColor"/>
                <rect x="2" y="8" width="3" height="1" fill="currentColor"/>
                <rect x="7" y="8" width="1" height="1" fill="currentColor"/>
                <rect x="9" y="8" width="2" height="1" fill="currentColor"/>
                <rect x="13" y="8" width="1" height="1" fill="currentColor"/>
                <rect x="15" y="8" width="2" height="1" fill="currentColor"/>
                <rect x="19" y="8" width="2" height="1" fill="currentColor"/>
                <rect x="1" y="10" width="2" height="1" fill="currentColor"/>
                <rect x="5" y="10" width="1" height="1" fill="currentColor"/>
                <rect x="8" y="10" width="3" height="1" fill="currentColor"/>
                <rect x="14" y="10" width="2" height="1" fill="currentColor"/>
                <rect x="18" y="10" width="3" height="1" fill="currentColor"/>
                <rect x="0" y="12" width="3" height="1" fill="currentColor"/>
                <rect x="5" y="12" width="2" height="1" fill="currentColor"/>
                <rect x="9" y="12" width="1" height="1" fill="currentColor"/>
                <rect x="12" y="12" width="3" height="1" fill="currentColor"/>
                <rect x="17" y="12" width="1" height="1" fill="currentColor"/>
                <rect x="20" y="12" width="1" height="1" fill="currentColor"/>
                <rect x="8" y="14" width="1" height="1" fill="currentColor"/>
                <rect x="10" y="14" width="2" height="1" fill="currentColor"/>
                <rect x="14" y="15" width="3" height="1" fill="currentColor"/>
                <rect x="19" y="15" width="2" height="1" fill="currentColor"/>
                <rect x="8" y="16" width="1" height="1" fill="currentColor"/>
                <rect x="11" y="16" width="2" height="1" fill="currentColor"/>
                <rect x="15" y="17" width="1" height="1" fill="currentColor"/>
                <rect x="18" y="17" width="3" height="1" fill="currentColor"/>
                <rect x="9" y="18" width="3" height="1" fill="currentColor"/>
                <rect x="14" y="18" width="2" height="1" fill="currentColor"/>
                <rect x="19" y="18" width="2" height="1" fill="currentColor"/>
                <rect x="8" y="20" width="2" height="1" fill="currentColor"/>
                <rect x="12" y="20" width="1" height="1" fill="currentColor"/>
                <rect x="15" y="20" width="3" height="1" fill="currentColor"/>
                <rect x="20" y="20" width="1" height="1" fill="currentColor"/>
              </svg>
              <div class="qr-scanner-line" id="qr-scanner-line"></div>
            </div>
            <div class="qr-status" id="qr-status">
              <span class="qr-dot"></span>
              <span id="qr-status-text">Ready to scan…</span>
            </div>
            <button class="btn primary full qr-btn" id="qr-scan-btn">
              📷 Scan QR Code
            </button>
            <p class="qr-hint">QR code is provided at restaurant entrance or manager desk</p>
          </div>
        </div>

        <!-- AUTH FORM -->
        <div id="auth-form-wrap" class="auth-form-wrap hidden">
          <button class="back-btn" id="back-to-roles">← Change role</button>
          <h2 id="auth-title">Sign in as Customer</h2>
          <div class="tabs">
            <button class="tab active" data-tab="login">Sign In</button>
            <button class="tab" data-tab="signup" id="signup-tab">Sign Up</button>
          </div>
          <form id="auth-form">
            <div class="form-group signup-only hidden">
              <label>Full Name</label>
              <input type="text" id="auth-name" placeholder="Your name" />
            </div>
            <div class="form-group">
              <label>Mobile Number</label>
              <input type="tel" id="auth-phone" placeholder="10-digit mobile" required />
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="auth-password" placeholder="Password" required />
            </div>
            <button type="submit" class="btn primary full" id="auth-submit">Sign In</button>
          </form>
          <p class="demo-hint" id="demo-hint"></p>
        </div>
      </div>
    </section>

    <!-- MAIN APP SHELL -->
    <section id="app-view" class="view">
      <header class="topbar">
        <div class="topbar-left">
          <span class="logo-sm">🍽️</span>
          <span class="app-name">SpiceRoute</span>
          <span class="role-badge" id="role-badge"></span>
        </div>
        <div class="topbar-right">
          <span class="user-name" id="user-name"></span>
          <button class="btn ghost sm" id="logout-btn">Logout</button>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="content" id="main-content">
          <!-- Dynamic panels injected here -->
        </main>
      </div>
    </section>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="/js/app.js"></script>
</body>
</html>
